name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (format, lint, architecture, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:quality-tools
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: npm test
      - run: node --test ../../deploy/cloudflare/*.test.mjs
      - run: npm run build

  api:
    name: API (vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - run: make -C ../.. format-go-check check-go-architecture
      - run: go vet ./...
      - run: go build ./...
      - name: Unit tests (database tests skip without TEST_DATABASE_URL)
        run: TEST_DATABASE_URL= go test -race -count=1 ./...

  api-integration:
    name: API integration (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - run: make test-integration

  api-lint:
    name: API lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - name: Read pinned linter version
        id: lint-version
        run: echo "version=$(cat scripts/tools/golangci-lint.version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: apps/api
          version: ${{ steps.lint-version.outputs.version }}

  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Install Chrome and system dependencies
        if: matrix.browser == 'chrome'
        run: npx playwright install --with-deps chrome
        working-directory: apps/web
      # Match the installed package; the image contains Chromium, not branded Chrome.
      - name: Pull prebuilt Playwright image
        id: playwright-image
        if: matrix.browser != 'chrome'
        working-directory: apps/web
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          image="mcr.microsoft.com/playwright:v${version}-noble"
          docker pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run against isolated database and local servers
        env:
          E2E_PLAYWRIGHT_IMAGE: ${{ steps.playwright-image.outputs.image }}
        run: sh scripts/testE2e.sh --project=${{ matrix.browser }}
      - name: Retain browser traces and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}
          path: |
            apps/web/test-results/
            .local/e2e-api.log
            .local/e2e-web.log
          retention-days: 7
