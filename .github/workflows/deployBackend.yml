name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

# Serialize the complete backend/frontend release. Keep the existing group
# so an in-flight backend deployment is also fenced during the transition.
# Pending runs may be coalesced; both publishers recheck the main head.
concurrency:
  group: todocal-backend-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Walker-mfj/TodoCal' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 95
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      ready: ${{ steps.delivery.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish tested API image or reuse its digest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: bash deploy/lightsail/publish.sh
      - name: Trigger private Lightsail deployment and wait for result
        id: delivery
        if: vars.LIGHTSAIL_EVENT_DEPLOY != 'false' && steps.image.outputs.digest != ''
        env:
          DEPLOY_TRIGGER_SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}
          DEPLOY_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 deploy/lightsail/triggerDeploy.py

  frontend:
    needs: publish
    # A skipped delivery (disabled or superseded) is NOT a confirmed backend.
    # Deployment/readiness failures (including legacy approval responses) fail the publish job.
    if: needs.publish.outputs.ready == 'true' && needs.publish.outputs.digest != ''
    permissions:
      contents: read
    uses: ./.github/workflows/deployFrontend.yml
    with:
      tested_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
