name: Deploy backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

# A newer CI run cannot cancel a deployment already underway. Pending runs
# may be coalesced by Actions; publish.sh checks the actual main head.
concurrency:
  group: todocal-backend-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Walker-mfj/TodoCal' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish tested API image or reuse its digest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: bash deploy/lightsail/publish.sh
      - name: Trigger private Lightsail deployment and wait for result
        if: vars.LIGHTSAIL_EVENT_DEPLOY == 'true' && steps.image.outputs.digest != ''
        env:
          DEPLOY_TRIGGER_SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}
          DEPLOY_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 deploy/lightsail/triggerDeploy.py
