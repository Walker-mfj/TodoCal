name: Publish backend image

on:
  workflow_call:
    secrets:
      DEPLOY_TRIGGER_SECRET:
        required: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish tested API commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/lightsail/publish.sh

      - name: Trigger private Lightsail deployment and wait for result
        if: vars.LIGHTSAIL_EVENT_DEPLOY == 'true' && steps.release.outputs.tag != ''
        env:
          DEPLOY_TRIGGER_SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}
          DEPLOY_TAG: ${{ steps.release.outputs.tag }}
        run: python3 deploy/lightsail/triggerDeploy.py
