name: Deploy frontend

on:
  workflow_call:
    inputs:
      tested_sha:
        description: Exact main commit that passed CI and backend delivery
        required: true
        type: string

permissions:
  contents: read

# Keep the old frontend lock during transition from independent deployments.
concurrency:
  group: todocal-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://todocal.digitalhome.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_sha }}
          persist-credentials: false
      - name: Verify tested checkout
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
        shell: bash
        run: |
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            deploy/cloudflare/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix apps/web
      - name: Install deployment dependencies
        run: npm ci --prefix deploy/cloudflare
      - name: Test frontend
        run: npm test --prefix apps/web
      - name: Test API proxy
        run: npm test --prefix deploy/cloudflare
      - name: Build frontend and prepare private source maps
        run: npm run build --prefix deploy/cloudflare
      - name: Check types
        run: npm run typecheck --prefix apps/web
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_STACK_API_TOKEN: ${{ secrets.BETTER_STACK_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$BETTER_STACK_API_TOKEN" || { echo 'Missing BETTER_STACK_API_TOKEN secret'; exit 1; }
      - name: Upload private source maps
        run: npm run upload:sourcemaps --prefix deploy/cloudflare
        env:
          BETTER_STACK_API_TOKEN: ${{ secrets.BETTER_STACK_API_TOKEN }}
      - name: Configure optional private deployment VPC binding
        env:
          DEPLOY_VPC_SERVICE_ID: ${{ vars.DEPLOY_VPC_SERVICE_ID }}
        run: python3 deploy/cloudflare/configureDeployBinding.py
      - name: Publish frontend
        id: publish
        working-directory: deploy/cloudflare
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 https://todocal.digitalhome.workers.dev/api/readyz | jq -e '.status == "ready"' >/dev/null
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$TESTED_SHA" ]]; then
            echo 'Main advanced; newer CI owns frontend publication.'
            exit 0
          fi
          npx --no-install wrangler deploy
          echo 'published=true' >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8cf9e69ea0ad681889782c541601c0d1
      - name: Check deployed website
        if: steps.publish.outputs.published == 'true'
        run: curl --fail --silent --show-error --retry 3 --max-time 30 https://todocal.digitalhome.workers.dev/ | grep -q TodoCal
