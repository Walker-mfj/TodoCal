name: Generate Wrangler lockfile (temporary)
on:
  push:
    branches: [chore/upgrade-wrangler-4.165.0]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit generated public lockfile
        run: |
          python3 - <<'PY'
          import pathlib
          for line in pathlib.Path("package-lock.json").read_text().splitlines():
              print("LOCKFILE|"+line)
          PY
      - run: npm ci
      - run: npm test
      - run: npx --no-install wrangler --version
