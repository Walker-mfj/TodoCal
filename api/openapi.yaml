openapi: 3.1.0
info:
  title: TodoCal API
  version: 0.5.0
  description: Authentication, owned task/group/settings APIs, recurrence, calendar
    finalized daily plans, and account-wide optional timers. Period reports use authoritative daily plans and focus intervals. Mutations require the configured Origin and application/json; domain
    mutations additionally require CSRF and Idempotency-Key.
servers:
- url: /api/v1
security:
- sessionCookie: []
paths:
  /auth/register:
    post:
      operationId: register
      security: []
      description: Creates an account, default settings, and a seven-day session atomically.
        Requires the configured Origin and application/json. Limited by email and
        IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Credentials'
              - type: object
                properties:
                  timezone:
                    type: string
                    default: UTC
      responses:
        '201':
          $ref: '#/components/responses/Session'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimit'
        default:
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      security: []
      description: Issues a fresh session token. Existing device sessions remain valid.
        Requires the configured Origin and application/json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimit'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: currentUser
      responses:
        '200':
          description: Current account, CSRF token, and settings
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Session'
                - type: object
                  required:
                  - settings
                  properties:
                    settings:
                      $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      description: Revokes only the current session and expires its cookie. Requires
        the configured Origin and application/json.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        default:
          $ref: '#/components/responses/Error'
  /auth/password:
    post:
      operationId: changePassword
      description: Verifies the current password and revokes all other sessions. Current
        session stays valid. Requires the configured Origin and application/json.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - oldPassword
              - newPassword
              properties:
                oldPassword:
                  type: string
                  writeOnly: true
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
      responses:
        '200':
          $ref: '#/components/responses/OK'
        default:
          $ref: '#/components/responses/Error'
  /tasks:
    get:
      operationId: listTasks
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        default:
          $ref: '#/components/responses/Error'
      description: Owned, non-deleted tasks ordered by UUID. nextCursor is null when
        exhausted. Title search is literal and case-insensitive. Account time zone
        defines date filters.
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: search
        in: query
        schema:
          type: string
      - name: priority
        in: query
        schema:
          type: string
          enum:
          - low
          - medium
          - high
      - name: status
        in: query
        schema:
          type: string
          enum:
          - incomplete
          - complete
      - name: groupId
        in: query
        schema:
          type: string
          description: UUID, or none for tasks without a group
      - name: view
        in: query
        schema:
          type: string
          enum:
          - all
          - today
          - upcoming
          - overdue
          - unscheduled
          - previously-unfinished
    post:
      operationId: createTask
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          $ref: '#/components/responses/Error'
      description: Title-only creation is supported; Pomodoro is optional. Times require
        a date and both endpoints, and may not cross midnight. New schedules must
        be today or later. Nonexistent DST wall times are rejected.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
  /tasks/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getTask
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateTask
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          $ref: '#/components/responses/Error'
      description: Partial editable-field update with optimistic concurrency. Foreign
        and deleted task IDs return 404.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
    delete:
      operationId: deleteTask
      responses:
        '200':
          $ref: '#/components/responses/OK'
        default:
          $ref: '#/components/responses/Error'
      description: Soft-deletes the current task and appends an event. Previous events
        remain stored.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevision'
  /tasks/{id}/schedule:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: rescheduleTask
      description: Atomically change only the schedule and issue an owned 10-second undo token bound to the resulting revision. All three nullable schedule fields are required. Finalized target dates are rejected.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '200':
          description: Schedule saved with undo token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTask'
        default:
          $ref: '#/components/responses/Error'
  /undo/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: undoSchedule
      description: Restore the server-stored previous schedule. Foreign IDs return 404; expired/consumed tokens and intervening task edits return 409. Send an empty JSON object.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Restored task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          $ref: '#/components/responses/Error'
  /tasks/{id}/completion:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: completeTask
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          $ref: '#/components/responses/Error'
      description: Completion never requires Pomodoro. Unscheduled completion stays
        unscheduled. Completing a future task requires moveToToday=true. Reopening
        invalidates same-day completion events; prior-day events remain valid.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionInput'
  /groups:
    get:
      operationId: listGroups
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createGroup
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
  /groups/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    patch:
      operationId: updateGroup
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPatch'
    delete:
      operationId: deleteGroup
      responses:
        '200':
          $ref: '#/components/responses/OK'
        default:
          $ref: '#/components/responses/Error'
      description: Clears task membership, increments affected task revisions, and
        retains task events. Does not delete tasks.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevision'
  /settings:
    get:
      operationId: getSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
      description: Partial update to the current account. Finalizes ended days under
        the previous time zone first; a forward time-zone jump seals crossed dates
        using states at change time. Previously finalized days are never reclassified.
        Schedules retain their local date/time labels.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
  /series:
    post:
      operationId: createSeries
      description: Creates a repeating series and its first occurrence. End date is
        inclusive. Additional occurrences are generated only for requested finite
        ranges or ended-day catch-up. Each occurrence is a task with independent state.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceSeries'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesInput'
  /series/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getSeries
      responses:
        '200':
          description: Current owned recurrence metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceSeries'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /series/{id}/stop:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: stopSeries
      description: Stops future generation and cancels future incomplete occurrences,
        preserving historical/current occurrences and explicitly completed tasks.
        Requires the current series revision. Edit series content through PATCH
        /tasks/{id} with scope all.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoppedSeries'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevision'
  /calendar:
    get:
      operationId: getCalendar
      description: End-exclusive range of 1–93 days. Catch-up finalizes ended days
        before reading. tasks contains current, editable-date tasks; days includes
        full historical snapshots and authoritative unfiltered progress. A nonexistent
        recurring wall time is skipped with a warning, not counted as a missed task.
        Such future predictions are reevaluated if the account time zone changes.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarRange'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date
  /reports/days/{date}:
    parameters:
    - in: path
      name: date
      required: true
      schema:
        type: string
        format: date
    get:
      operationId: getDayReport
      description: Returns the current or finalized daily plan; a future date has
        no percentage. Includes day focus intervals, completed task IDs, and Pomodoros.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsDay'
        default:
          $ref: '#/components/responses/Error'
  /focus:
    get:
      operationId: getFocusState
      description: Settles an expired session and returns the account timer. No automatic next session.
      responses:
        '200':
          description: Authoritative timer state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusState'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: startFocus
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [focus, short_break, long_break]
                durationMinutes:
                  type: integer
                  minimum: 1
                  maximum: 180
                  description: Optional session duration; defaults to account settings.
                taskId:
                  type: [string, 'null']
                  format: uuid
      responses:
        '201':
          description: Timer started; duration captured from request or current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusState'
        default:
          $ref: '#/components/responses/Error'
  /focus/{id}/{action}:
    post:
      operationId: changeFocus
      description: Server timestamps only. Ending a terminal session is a no-op. Stale pause/resume/end revisions are rejected for active sessions.
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [pause, resume, end]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Authoritative timer state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusState'
        default:
          $ref: '#/components/responses/Error'
  /reports/period:
    get:
      operationId: getPeriodReport
      parameters:
      - name: period
        in: query
        required: true
        schema: {type: string, enum: [week, month]}
      - name: date
        in: query
        required: true
        schema: {type: string, format: date}
      responses:
        '200':
          description: Weighted completion totals, unique completed tasks, focus time, daily detail, and matched prior-period comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodReport'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: focus_session
  parameters:
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Generate once per intended command. Retry the identical method,
        request URI, and JSON bytes with the same key. A different request using the
        key returns 409. Keys are scoped to the account.
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    DayFocusEntry:
      type: object
      required: [id, taskTitle, status, focusSeconds, pomodoros]
      properties:
        id: {type: string, format: uuid}
        taskTitle: {type: [string, 'null']}
        status: {type: string}
        focusSeconds: {type: number}
        pomodoros: {type: integer}
    AnalyticsDay:
      allOf:
      - $ref: '#/components/schemas/DayReport'
      - type: object
        required: [completedTasks, completedIds, focusTimezone, focusSeconds, pomodoros, focusSessions]
        properties:
          focusTimezone: {type: string}
          completedTasks: {type: integer}
          completedIds:
            type: array
            items: {type: string, format: uuid}
          focusSeconds: {type: number}
          pomodoros: {type: integer}
          focusSessions:
            type: array
            items:
              $ref: '#/components/schemas/DayFocusEntry'
    PeriodMetrics:
      type: object
      required: [planned, completed, percentage, completedTasks, focusSeconds, pomodoros, completeDays, plannedDays]
      properties:
        planned: {type: integer}
        completed: {type: integer}
        percentage: {type: [number, 'null']}
        completedTasks: {type: integer}
        focusSeconds: {type: number}
        pomodoros: {type: integer}
        completeDays: {type: integer}
        plannedDays: {type: integer}
    PeriodReport:
      type: object
      required: [period, from, to, through, timezone, metrics, days, comparison]
      properties:
        period: {type: string, enum: [week, month]}
        from: {type: string, format: date}
        to: {type: string, format: date}
        through: {type: string, format: date-time}
        timezone: {type: string}
        metrics:
          $ref: '#/components/schemas/PeriodMetrics'
        days:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDay'
        comparison:
          type: object
          required: [from, to, through, metrics, percentagePointChange, focusSecondsChange]
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
            through: {type: string, format: date-time}
            metrics:
              $ref: '#/components/schemas/PeriodMetrics'
            percentagePointChange: {type: [number, 'null']}
            focusSecondsChange: {type: [number, 'null']}
    FocusSession:
      type: object
      required: [id, taskId, taskTitle, kind, status, targetSeconds, elapsedSeconds, focusSeconds, pomodoros, startedAt, endedAt, runningSince, revision]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: [string, 'null'], format: uuid}
        taskTitle: {type: [string, 'null']}
        kind: {type: string, enum: [focus, short_break, long_break]}
        status: {type: string, enum: [running, paused, completed, ended]}
        targetSeconds: {type: integer}
        elapsedSeconds: {type: integer}
        focusSeconds: {type: integer}
        pomodoros: {type: integer, enum: [0, 1]}
        startedAt: {type: string, format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        runningSince: {type: [string, 'null'], format: date-time}
        revision: {type: integer}
    FocusState:
      type: object
      required: [active, last, nextKind, completedFocusSessions, serverNow]
      properties:
        active:
          anyOf:
          - $ref: '#/components/schemas/FocusSession'
          - type: 'null'
        last:
          anyOf:
          - $ref: '#/components/schemas/FocusSession'
          - type: 'null'
        nextKind: {type: string, enum: [focus, short_break, long_break]}
        completedFocusSessions: {type: integer}
        serverNow: {type: string, format: date-time}
    Credentials:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    User:
      type: object
      required:
      - id
      - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    Session:
      type: object
      required:
      - user
      - csrfToken
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrfToken:
          type: string
    Settings:
      type: object
      required:
      - timezone
      - appearance
      - focusMinutes
      - shortBreakMinutes
      - longBreakMinutes
      - sound
      - revision
      properties:
        timezone:
          type: string
        appearance:
          type: string
          enum:
          - light
          - dark
        focusMinutes:
          type: integer
          default: 25
        shortBreakMinutes:
          type: integer
          default: 5
        longBreakMinutes:
          type: integer
          default: 15
        sound:
          type: boolean
          default: true
        revision:
          type: integer
          minimum: 1
    APIError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    TaskInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 10000
          default: ''
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          default: medium
        scheduledDate:
          type:
          - string
          - 'null'
          format: date
        startTime:
          type:
          - string
          - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        endTime:
          type:
          - string
          - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        deadline:
          type:
          - string
          - 'null'
          format: date-time
        estimatedPomodoros:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 2147483647
      required:
      - title
    TaskPatch:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [one, all]
          default: one
